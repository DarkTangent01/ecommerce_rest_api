name: CI

on:
  push:
  pull_request:

# Least privilege: the job only needs to read the repository.
permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      # Pinned to full commit SHAs (SEC-14); Dependabot (.github/dependabot.yml) proposes updates.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # The dev toolchain needs a newer Node than the app: vitest 5 requires ^22.12 || >=24 and
          # eslint 10 ^20.19 || ^22.13 || >=24. 24 is the LTS all local checks run on.
          node-version: 24
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn typecheck
      - run: yarn lint
      - run: yarn test
      - run: yarn build
      # Fails on moderate or worse advisories in production dependencies (DEP-01).
      - run: yarn audit --groups dependencies --level moderate
      # Full report including dev tooling, for visibility; does not block the build.
      - run: yarn audit || true
